# yaml-language-server: $schema=https://raw.githubusercontent.com/cncf/landscape2/refs/heads/main/docs/config/schema/settings.schema.json

foundation: Intelligent Routing

url: http://127.0.0.1:8000

colors:
  color1: "rgba(51, 157, 241, 1)"
  color2: "rgba(255, 182, 27, 1)"
  color3: "rgba(33, 101, 180, 1)"
  color4: "rgba(12, 31, 56, 0.90)"
  color5: "rgba(51, 157, 241, 0.72)"
  color6: "rgba(18, 48, 84, 0.76)"
  color7: "rgba(205, 230, 255, 1)"

description: A living map of intelligent routing across fragmented models, devices, locations, and preferences.

footer:
  logo: "brand/intelligent-routing-mark-512.png"
  text: "**Map the fragmentation. Build the routing layer.**"

grid_items_size: large

groups:
  # Landscape2 reserves `all` for its Card view. Keep a distinct internal
  # identifier so the full landscape is rendered once, then label it "All"
  # in the small UI override.
  - name: Everything
    alias: all
    categories:
      - Open Routing Systems
      - Routing Products
      - Evaluation and Community
      - Gateway and Execution
  - name: Open Routing
    alias: open
    categories:
      - Open Routing Systems
  - name: Routing Products
    alias: products
    categories:
      - Routing Products
  - name: Evaluation
    alias: evaluation
    categories:
      - Evaluation and Community
  - name: Gateway and Serving
    alias: execution
    categories:
      - Gateway and Execution

header:
  logo: "brand/intelligent-routing-mark-512.png"
  motd: "**Intelligence is fragmenting. Routing is becoming the system.** Explore the products, open systems, research, and execution layers shaping intelligent routing."

hide_organization_section_in_projects: true

images:
  open_graph: "http://127.0.0.1:8000/images/intelligent-routing-mark-512.png"

logos_viewbox:
  adjust: true
  exclude:
    - nadir.svg

view_mode: card
